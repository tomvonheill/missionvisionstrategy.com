name: check

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx astro check
      - name: Test the CI scripts
        run: |
          python3 .github/scripts/test_check_links.py

      - name: Build
        run: npm run build
      - name: Check the build
        run: |
          python3 .github/scripts/check_links.py dist
          npx html-validate "dist/**/*.html"
