name: check

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Infrastructure files are Tom's
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          else
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
            RANGE="$BEFORE..$SHA"
          fi
          python3 .github/scripts/guard_paths.py "$RANGE"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx astro check
      - name: Unit tests
        run: npm test
      - name: Test the CI scripts
        run: |
          python3 .github/scripts/test_check_links.py
          python3 .github/scripts/test_guard_paths.py

      - name: Build as the dev site (drafts included)
        run: PUBLIC_SITE_ENV=dev npm run build
      - name: Check the dev build
        run: |
          python3 .github/scripts/check_links.py dist
          npx --yes html-validate@9 "dist/**/*.html"

      - name: Build as the live site
        run: npm run build
      - name: Check the live build
        run: |
          python3 .github/scripts/check_links.py dist
          npx --yes html-validate@9 "dist/**/*.html"
          if find src/content/insights -mindepth 2 -maxdepth 2 -name index.md -exec grep -L '^draft: true' {} + | grep -q .; then
            node scripts/check-dist.ts dist posts
          else
            node scripts/check-dist.ts dist none
          fi
